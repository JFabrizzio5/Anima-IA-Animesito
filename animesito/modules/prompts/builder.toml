# The modular prompt builder: zones and their preset options.
#
# Ported from v1's "Constructor Modular" (public/index.html). Edit freely: add
# an option as { label = "...", tags = "..." }. Anything not listed can be
# searched live on Danbooru from the same zone, so presets are shortcuts, not
# the vocabulary. Characters are searched (Danbooru + AniList), not listed.
#
# v1's adult presets were not carried over as presets; their tags remain one
# search away, and the policy module checks every prompt either way.

[[zones]]
id = "outfit"
label = "Atuendo"
options = [
