# Artistic styles, ported verbatim from v1's "Anime Classic" (animeClassicGenerator.js,
# styleDefinitions + the per-style steps/CFG/sampler switch). A1111 sampler names
# map to ComfyUI as: "Euler a" -> euler_ancestral/normal, "DPM++ 2M Karras" ->
# dpmpp_2m/karras, "DPM++ SDE Karras" -> dpmpp_sde/karras.
#
# A style's `pos` replaces the model family's quality tags and its `neg` replaces
# the family's default negative (an operator override from Ajustes still applies).
# v1 sent 1920x1080 / 1080x1920 straight to SDXL; here those styles turn on the
# hires pass from an SDXL-native size instead, which ends near the same pixels
# without duplicated limbs.

[[styles]]
id = "oficial_flat"
group = "Estilos limpios y anime"
label = "📺 Anime oficial (ej. KanoKari) · plano, 2D, limpio"
pos = "masterpiece, best quality, newest, official anime style, flat colors, lineart, simple shading, 2d, highres"
neg = "3d, realistic, complex shading, gradients, cinematic lighting, bad quality, worst quality, sketch, (bad)"
steps = 25
cfg = 5.5
sampler = "euler_ancestral"
scheduler = "normal"

