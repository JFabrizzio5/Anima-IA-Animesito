# Models the installer can fetch (scripts/fetch_models.py), by group.
#
# Every file is pinned to a repo commit, a size and a sha256 from the Hugging
# Face API, and each one matched byte for byte a working install on
# 2026-10-15. A file already present under `file` or one of `aliases` (same
# folder) is never downloaded again, and an existing file is never replaced.
#
# `license` is what the source repo declares. Re-uploads (not the author's
# repo) may declare something other than the author's terms: check before
# commercial use. Left out on purpose: waiREALCN_v20 (no copy left on Hugging
# Face), and the video / Kontext / redcraft files the app does not drive.

[groups.base]
label = "WAI Illustrious (main anime model) + dolphin-mistral for 'Mejorar con IA'"
default = true

[groups.anime]
label = "NoobAI v-pred, Animagine XL 3.1, Pony Diffusion V6"

[groups.realistic]
label = "RealVisXL V4.0, Juggernaut XL v9"

[groups.flux]
label = "Flux dev Q5_K_S (GGUF) + text encoders + VAE + adult LoRA + ComfyUI-GGUF node"

[groups.extra]
label = "Flux dev Q8_0 (needs more VRAM), dolphin-llama3"

