# animesito — generated by `jfast workspace compose`.
# Do not edit by hand: regenerate after adding a service.
#
# Frontends are absent on purpose. A built SPA is static files, served
# by Caddy from ./animesito-web/dist — there is no container to run. Build it
# first (`npm run build` in the frontend), or Caddy serves nothing.
#
# One service on its own is generated by `jfast deploy compose`, which
# names its datastores after the plugin that wants them (`postgres`,
# `POSTGRES_PASSWORD`) rather than after a resource — see
# docs/deploy.md, `Two generators`.
#
# Containers are named by compose, from the project (the directory, or
# `docker compose -p <name>`) -- never pinned here, so an old copy of
# this workspace and a new one can run side by side.
services:
  animesito-database:
    image: "pgvector/pgvector:pg16"
    restart: unless-stopped
    ports:
      - "7790:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: "${ANIMESITO_DATABASE_PASSWORD:?set ANIMESITO_DATABASE_PASSWORD}"
    volumes:
      - "animesito_database_data:/var/lib/postgresql/data"
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U app
      interval: 5s
      timeout: 3s
      retries: 10
  animesito-cache:
    image: "redis:7-alpine"
    restart: unless-stopped
    ports:
      - "7792:6379"
    command: redis-server --appendonly yes
    volumes:
      - "animesito_cache_data:/data"
  animesito:
    build:
      context: ./animesito
    restart: unless-stopped
    env_file:
      - ./animesito/.env
    environment:
      JFAST_APP_NAME: animesito
      JFAST_PORT: 7789
      JFAST_DB_DSN: "postgresql+asyncpg://app:${ANIMESITO_DATABASE_PASSWORD}@animesito-database:5432/app"
      JFAST_CACHE_URL: "redis://animesito-cache:6379/0"
    ports:
      - "7789:7789"
    depends_on:
      animesito-database:
        condition: service_healthy
      animesito-cache:
        condition: service_started
  animesito-worker:
    build:
      context: ./animesito
    restart: unless-stopped
    env_file:
      - ./animesito/.env
    environment:
      JFAST_APP_NAME: animesito
      JFAST_PORT: 7789
      JFAST_DB_DSN: "postgresql+asyncpg://app:${ANIMESITO_DATABASE_PASSWORD}@animesito-database:5432/app"
      JFAST_CACHE_URL: "redis://animesito-cache:6379/0"
    command:
      - jfast
      - worker
      - "--grace=25"
    healthcheck:
      disable: true
    stop_grace_period: 30s
    depends_on:
      animesito-database:
        condition: service_healthy
      animesito-cache:
        condition: service_started
      animesito:
        condition: service_healthy
  caddy:
    image: "caddy:2-alpine"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "./Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./animesito-web/dist:/srv:ro"
      - "caddy_data:/data"
      - "caddy_config:/config"
    depends_on:
      - animesito
volumes:
  animesito_database_data: null
  animesito_cache_data: null
  caddy_data: null
  caddy_config: null
